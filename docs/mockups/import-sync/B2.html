<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Outlooker — 匯入 · B2 來源清單＋詳細資料</title>
<style>
:root {
  --fg1:#242424; --fg2:#424242; --fg3:#616161; --fg4:#707070; --onBrand:#fff;
  --bg1:#fff; --bg1h:#f5f5f5; --bg2:#fafafa; --bg3:#f5f5f5; --bg4:#f0f0f0; --bg5:#ebebeb;
  --st1:#d1d1d1; --st2:#e0e0e0; --st3:#f0f0f0; --stAcc:#616161;
  --brand:#0f6cbd; --brandH:#115ea3; --brandP:#0c3b5e; --brand2:#ebf3fc; --brand2H:#cfe4fa; --brandFg2:#115ea3; --brandSt2:#b4d6fa;
  --okFg:#0e700e; --okBg:#f1faf1; --okBd:#9fd89f;
  --warnFg:#8a3707; --warnBg:#fff9f5; --warnBd:#fdcfb4;
  --errFg:#b10e1c; --errBg:#fdf3f4; --errBd:#eeacb2;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --r:4px; --rL:8px;
  --shadow2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);
  --shadow4:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);
  --shadow8:0 0 2px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--fg1);background:var(--bg3);overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:1px;box-shadow:0 0 0 1px #fff inset;border-radius:var(--r)}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.s16{width:16px;height:16px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* shell (from docs/mockups/variant-1) */
.app{display:grid;grid-template-rows:48px 1fr;grid-template-columns:68px 1fr;height:100vh}
.header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-right:16px;background:var(--brand);color:#fff}
.header .brand{width:68px;display:grid;place-items:center}
.logo{width:28px;height:28px;border-radius:var(--r);background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700}
.header h1{font-size:16px;font-weight:600;margin:0}
.header .crumb{opacity:.9}
.header .spacer{flex:1}
.header .label{font-size:12px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:2px 12px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brandFg2);font-weight:600}
.rail{background:var(--bg3);display:flex;flex-direction:column;gap:4px;padding:8px 4px;border-right:1px solid var(--st2)}
.rail .grow{flex:1}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:transparent;border-radius:var(--r);color:var(--fg2);font-size:10px;line-height:14px;cursor:pointer}
.rail button:hover{background:var(--bg1h)}
.rail button[aria-current="page"]{background:var(--bg1);color:var(--brand);font-weight:600;box-shadow:var(--shadow2)}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:-4px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--brand)}
.rail svg.ic{width:24px;height:24px}
main{overflow:hidden;min-height:0}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:32px;padding:4px 12px;border:1px solid var(--st1);background:var(--bg1);border-radius:var(--r);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--bg1h)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--brandH)}
.btn.subtle{border-color:transparent;background:transparent;font-weight:400}
.btn.subtle:hover{background:var(--bg1h)}
.btn.small{min-height:24px;padding:0 8px;font-size:12px}
.btn.icon{padding:4px;min-width:32px}
.btn.small.icon{min-width:24px;padding:2px}
.btn.danger{color:var(--errFg)}
.btn[disabled]{color:var(--fg4);background:var(--bg3);border-color:var(--st2);cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--brand2);border-color:var(--brandSt2);color:var(--brandFg2)}
.input{min-height:32px;padding:0 8px;border:1px solid var(--st1);border-bottom-color:var(--stAcc);border-radius:var(--r);background:var(--bg1);min-width:0}
.input:focus{outline:none;border-bottom:2px solid var(--brand)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:999px;font-size:12px;line-height:20px;background:var(--bg4);color:var(--fg2);white-space:nowrap}
.badge.brand{background:var(--brand2);color:var(--brandFg2)}
.badge.ok{background:var(--okBg);color:var(--okFg);border:1px solid var(--okBd)}
.badge.warn{background:var(--warnBg);color:var(--warnFg);border:1px solid var(--warnBd)}
.badge.err{background:var(--errBg);color:var(--errFg);border:1px solid var(--errBd)}
.muted{color:var(--fg3)}
.caption{font-size:12px;line-height:16px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:2px;background:var(--bg5);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:2px}
.progress.indet>i{width:30%;animation:indet 1.6s linear infinite}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px}
.switch input{position:absolute;opacity:0;width:40px;height:20px;margin:0;cursor:pointer}
.switch .track{width:40px;height:20px;border-radius:999px;border:1px solid var(--stAcc);background:var(--bg1);position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg3);transition:left .15s}
.switch input:checked+.track{background:var(--brand);border-color:transparent}
.switch input:checked+.track::after{left:23px;background:#fff}
.switch input:focus-visible+.track{outline:2px solid #000;outline-offset:2px}
.msgbar{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid var(--brandSt2);background:var(--brand2);border-radius:var(--r);font-size:12px;line-height:16px}
.msgbar svg{color:var(--brand);margin-top:0}
.msgbar.warn{border-color:var(--warnBd);background:var(--warnBg)} .msgbar.warn svg{color:var(--warnFg)}
.msgbar.err{border-color:var(--errBd);background:var(--errBg)} .msgbar.err svg{color:var(--errFg)}
.msgbar.neutral{border-color:var(--st2);background:var(--bg3)} .msgbar.neutral svg{color:var(--fg3)}
.msgbar .grow{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:48px 24px;color:var(--fg3)}
.empty .art{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--brand2);color:var(--brand);margin-bottom:8px}
.empty .art svg{width:36px;height:36px}
.empty h3{margin:0;color:var(--fg1);font-size:20px;line-height:28px;font-weight:600}
.empty p{margin:0;max-width:440px}

/* ---------- B2 page: master–detail ---------- */
.page{display:grid;grid-template-columns:320px 1fr;grid-template-rows:1fr auto;height:100%;min-height:0}
.pane{background:var(--bg1);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.pane+.pane{border-left:1px solid var(--st2)}
.pane-head{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:44px;border-bottom:1px solid var(--st2)}
.pane-head h2{margin:0;font-size:14px;font-weight:600}
.pane-head .count{color:var(--fg3);font-size:12px}
.pane-head .spacer{flex:1}
.scroll{overflow:auto;flex:1;min-height:0}
.master-actions{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--st2)}
.master-actions .btn{flex:1}
.nav-item{display:grid;grid-template-columns:20px 1fr auto;gap:0 10px;align-items:center;padding:8px 12px;border:0;border-bottom:1px solid var(--st3);background:transparent;width:100%;text-align:left;cursor:pointer;position:relative}
.nav-item:hover{background:var(--bg1h)}
.nav-item[aria-selected="true"]{background:var(--brand2)}
.nav-item[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.nav-item .ic{grid-row:1/3}
.nav-item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .sub{grid-column:2;font-size:12px;line-height:16px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .right{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--fg3)}
.nav-item .mini{width:64px}
.nav-item.sched{background:var(--bg2)}
.nav-item.sched[aria-selected="true"]{background:var(--brand2)}
.list-group{position:sticky;top:0;z-index:1;background:var(--bg2);padding:4px 12px;font-size:12px;font-weight:600;color:var(--fg2);border-bottom:1px solid var(--st2)}
.c-ok{color:var(--okFg)} .c-sync{color:var(--brand)} .c-q{color:var(--fg3)} .c-lock{color:var(--warnFg)} .c-err{color:var(--errFg)} .c-off{color:var(--fg4)}
.master-empty{padding:24px 16px;text-align:center;color:var(--fg3);font-size:12px}
/* detail */
.detail{overflow:auto}
.d-head{padding:16px 24px 12px;display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;border-bottom:1px solid var(--st2)}
.d-head .pst{width:40px;height:40px;border-radius:var(--r);background:var(--brand2);color:var(--brand);display:grid;place-items:center;grid-row:1/3}
.d-head h2{margin:0;font-size:20px;line-height:28px;font-weight:600;display:flex;gap:8px;align-items:center}
.d-head .path{display:flex;gap:4px;align-items:center;color:var(--fg2);min-width:0}
.d-head .path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-head .acts{grid-row:1/3;grid-column:3;display:flex;gap:8px;align-items:center}
.d-body{padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px;max-width:1100px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--st2);border-radius:var(--rL)}
.tiles div{padding:10px 14px;display:flex;flex-direction:column;min-width:0}
.tiles div+div{border-left:1px solid var(--st2)}
.tiles dt{font-size:12px;color:var(--fg3)}
.tiles dd{margin:0;font-size:16px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles dd.plus{color:var(--okFg)}
.live{border:1px solid var(--brandSt2);border-radius:var(--rL);padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--bg1)}
.live .row1{display:flex;gap:8px;align-items:baseline}
.live .row1 .spacer{flex:1}
.phases{display:flex;gap:2px}
.phases span{flex:1;font-size:10px;line-height:14px;color:var(--fg3);border-top:3px solid var(--bg5);padding-top:2px}
.phases span.done{border-color:var(--brand);color:var(--fg2)}
.phases span.cur{border-color:var(--brandSt2);color:var(--brand);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--st2)}
.tabs button{border:0;background:transparent;padding:8px 10px;cursor:pointer;position:relative;color:var(--fg2)}
.tabs button[aria-selected="true"]{color:var(--fg1);font-weight:600}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:2px;background:var(--brand)}
table.grid{width:100%;border-collapse:collapse}
table.grid th{text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--st1);white-space:nowrap;font-size:12px;color:var(--fg2)}
table.grid td{padding:6px 12px;border-bottom:1px solid var(--st3);white-space:nowrap}
table.grid .n{text-align:right;font-variant-numeric:tabular-nums}
table.grid td .ic{vertical-align:-3px;margin-right:4px}
.log li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--st3);font-size:12px}
.log{list-style:none;margin:0;padding:0}
/* settings-style schedule page */
.set{padding:20px 24px;display:flex;flex-direction:column;gap:16px;max-width:760px}
.set h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
.card{background:var(--bg1);border:1px solid var(--st2);border-radius:var(--rL);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:14px;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1px solid var(--st1);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;background:var(--bg1)}
.mode:hover{background:var(--bg1h)}
.mode:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand2)}
.mode input{accent-color:var(--brand);margin:3px 0 0}
.mode b{display:block;font-weight:600}
.mode small{display:block;color:var(--fg3);font-size:12px;line-height:16px}
.frow{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;align-items:center}
.frow>.lbl{font-weight:600}
.spin-btn{display:inline-flex;align-items:stretch;border:1px solid var(--st1);border-bottom-color:var(--stAcc);border-radius:var(--r);overflow:hidden;height:32px}
.spin-btn input{width:64px;border:0;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.spin-btn input:focus{outline:none}
.spin-btn .arrows{display:flex;flex-direction:column;border-left:1px solid var(--st2)}
.spin-btn .arrows button{flex:1;border:0;background:var(--bg1);padding:0 6px;font-size:8px;line-height:1;cursor:pointer;color:var(--fg3)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{min-width:40px;height:28px;padding:0 10px;border:1px solid var(--st1);border-radius:999px;background:var(--bg1);cursor:pointer;font-size:12px}
.days button[aria-pressed="true"]{background:var(--brand2);border-color:var(--brand);color:var(--brandFg2);font-weight:600}
.mode-panel[hidden]{display:none}
.timeline{display:flex;gap:8px;flex-wrap:wrap}
.timeline span{padding:2px 8px;border-radius:var(--r);background:var(--bg3);font-size:12px;font-variant-numeric:tabular-nums}
.timeline span:first-child{background:var(--brand2);color:var(--brandFg2);font-weight:600}
.set-foot{display:flex;gap:8px;justify-content:flex-end}
/* status bar = current activity */
.statusbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:6px 16px;background:var(--bg1);border-top:1px solid var(--st2);font-size:12px;min-height:40px}
.statusbar .ic.spin{color:var(--brand);animation:rot 2s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.statusbar .progress{width:220px}
.statusbar .spacer{flex:1}
.statusbar .sep{width:1px;height:20px;background:var(--st2)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.5 12.5L17 17"/></symbol>
  <symbol id="i-sql" viewBox="0 0 20 20"><ellipse cx="10" cy="5" rx="6" ry="2.5"/><path d="M4 5v10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V5M4 10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></symbol>
  <symbol id="i-import" viewBox="0 0 20 20"><path d="M10 3v9M6.5 8.5L10 12l3.5-3.5M3 13v2.5A1.5 1.5 0 004.5 17h11a1.5 1.5 0 001.5-1.5V13"/></symbol>
  <symbol id="i-settings" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5l1.3 2 2.3-.6.6 2.3 2.3.6-.6 2.3 1.6 1.6-1.6 1.6.6 2.3-2.3.6-.6 2.3-2.3-.6L10 17.5l-1.3-2-2.3.6-.6-2.3-2.3-.6.6-2.3L2.5 10l1.6-1.6-.6-2.3 2.3-.6.6-2.3 2.3.6z"/></symbol>
  <symbol id="i-rocket" viewBox="0 0 20 20"><path d="M11.5 3.5c2.5-1 4.5-1 5-1 0 .5 0 2.5-1 5L10 13l-3-3zM7 10l-3 .5L2.5 13 6 12.5M10 13l-.5 3 2.5-1.5.5-3.5M5 15l-2 2"/></symbol>
  <symbol id="i-pst" viewBox="0 0 20 20"><rect x="3.5" y="2.5" width="13" height="15" rx="1.5"/><path d="M7 7h6M7 10h6M7 13h3"/></symbol>
  <symbol id="i-sync" viewBox="0 0 20 20"><path d="M16 10a6 6 0 01-10.6 3.9M4 10a6 6 0 0110.6-3.9M14.6 2.8v3.3h-3.3M5.4 17.2v-3.3h3.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M6.8 10.2l2.2 2.2 4.2-4.6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.3l2.8 1.7"/></symbol>
  <symbol id="i-cal" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="1.5"/><path d="M3 8h14M7 2.5V5M13 2.5V5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 016 0V9"/></symbol>
  <symbol id="i-err" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v5M10 13.8v.01"/></symbol>
  <symbol id="i-off" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M4.7 15.3L15.3 4.7"/></symbol>
  <symbol id="i-hour" viewBox="0 0 20 20"><path d="M6 2.5h8M6 17.5h8M7 2.5v3l3 4.5-3 4.5v3M13 2.5v3l-3 4.5 3 4.5v3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V4h4v1.5M5 5.5l.8 10.6A1.5 1.5 0 007.3 17.5h5.4a1.5 1.5 0 001.5-1.4L15 5.5M8.5 8.5v6M11.5 8.5v6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2.5 6V15a1.5 1.5 0 001.5 1.5h12a1.5 1.5 0 001.5-1.5V8A1.5 1.5 0 0016 6.5H9.5L8 4.5H4A1.5 1.5 0 002.5 6z"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></symbol>
  <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.5v.01"/></symbol>
  <symbol id="i-more" viewBox="0 0 20 20"><path d="M5 10h.01M10 10h.01M15 10h.01" stroke-width="2.4"/></symbol>
</svg>

<div class="app">
  <header class="header">
    <div class="brand"><div class="logo" aria-hidden="true">O</div></div>
    <h1>Outlooker</h1>
    <span class="crumb">匯入</span>
    <span class="spacer"></span>
    <span class="label">原型狀態</span>
    <div class="seg" role="group" aria-label="原型資料狀態" id="dataSeg">
      <button type="button" data-data="full" aria-pressed="true">範例資料</button>
      <button type="button" data-data="empty" aria-pressed="false">空狀態</button>
    </div>
  </header>

  <nav class="rail" aria-label="主要">
    <button type="button"><svg class="ic"><use href="#i-search"/></svg><span>搜尋</span></button>
    <button type="button"><svg class="ic"><use href="#i-sql"/></svg><span>進階 SQL</span></button>
    <button type="button" aria-current="page"><svg class="ic"><use href="#i-import"/></svg><span>匯入</span></button>
    <span class="grow"></span>
    <button type="button"><svg class="ic"><use href="#i-rocket"/></svg><span>首次設定</span></button>
    <button type="button"><svg class="ic"><use href="#i-settings"/></svg><span>設定</span></button>
  </nav>

  <main>
<div class="page">

<!-- Schedule view template (settings-style) -->
<template id="tpl-schedule">
  <div class="set">
    <h2>同步排程</h2>
    <span class="muted">一個排程套用到所有已啟用的 PST 路徑。只會新增郵件；Outlook 中刪除或移動的郵件仍保留在資料庫。</span>
    <section class="card" aria-labelledby="h-mode">
      <h3 id="h-mode">同步方式</h3>
      <div class="modes" role="radiogroup" aria-labelledby="h-mode">
        <label class="mode"><input type="radio" name="mode" value="off"><span><b>關閉</b><small>只在按「立即同步」時同步</small></span></label>
        <label class="mode"><input type="radio" name="mode" value="interval" checked><span><b>固定間隔</b><small>每隔 N 分鐘或 N 小時</small></span></label>
        <label class="mode"><input type="radio" name="mode" value="daily"><span><b>每天固定時間</b><small>指定時間與星期幾</small></span></label>
      </div>
      <div class="mode-panel frow" data-mode="interval">
        <span class="lbl">每隔</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="spin-btn"><input type="text" inputmode="numeric" value="30" aria-label="間隔數值"><span class="arrows"><button type="button" aria-label="增加">▲</button><button type="button" aria-label="減少">▼</button></span></span>
          <select class="input" aria-label="間隔單位"><option selected>分鐘</option><option>小時</option></select>
          <span class="caption muted">5 分鐘到 24 小時</span>
        </div>
      </div>
      <div class="mode-panel frow" data-mode="daily" hidden>
        <span class="lbl">時間</span>
        <input class="input" type="time" value="08:30" aria-label="每日同步時間" style="width:120px">
        <span class="lbl">星期</span>
        <div class="days" role="group" aria-label="同步的星期">
          <button type="button" aria-pressed="true">週一</button><button type="button" aria-pressed="true">週二</button><button type="button" aria-pressed="true">週三</button><button type="button" aria-pressed="true">週四</button><button type="button" aria-pressed="true">週五</button><button type="button" aria-pressed="false">週六</button><button type="button" aria-pressed="false">週日</button>
        </div>
      </div>
      <div class="mode-panel" data-mode="off" hidden><span class="caption muted">排程已關閉。各路徑仍可用「立即同步」。</span></div>
    </section>
    <section class="card" aria-labelledby="h-next">
      <h3 id="h-next">接下來的同步</h3>

      <div class="msgbar"><svg class="ic s16"><use href="#i-info"/></svg><span class="grow">只在 Outlooker 開啟時同步，不會在背景或開機時執行。若 App 關閉期間錯過排程，下次開啟時會補跑一次（只補一次，不會逐次補跑）。</span></div>
    </section>
    <section class="card" aria-labelledby="h-rules">
      <h3 id="h-rules">同步時會怎麼處理</h3>
      <div class="msgbar neutral"><svg class="ic s16"><use href="#i-check"/></svg><span class="grow">檔案大小與修改時間沒變：直接略過，不開啟檔案。</span></div>
      <div class="msgbar warn"><svg class="ic s16"><use href="#i-lock"/></svg><span class="grow">檔案被 Outlook 開啟：略過並標示「已鎖定」，下次排程或手動同步時重試。</span></div>
    </section>
    <div class="set-foot"><button type="button" class="btn">還原</button><button type="button" class="btn primary">儲存排程</button></div>
  </div>
</template>

<template id="tpl-empty">

<script>
// Demo data + tiny renderer (tabs, selection, states). Not production code.
const S = {
  ok:     { ic: 'i-check', c: 'c-ok',   label: '已是最新', badge: 'ok' },
  sync:   { ic: 'i-sync',  c: 'c-sync', label: '同步中',   badge: 'brand' },
  queued: { ic: 'i-hour',  c: 'c-q',    label: '等待中',   badge: '' },
  locked: { ic: 'i-lock',  c: 'c-lock', label: '已鎖定',   badge: 'warn' },
  failed: { ic: 'i-err',   c: 'c-err',  label: '失敗',     badge: 'err' },
  off:    { ic: 'i-off',   c: 'c-off',  label: '已停用',   badge: '' },
};
const SRC = [
  { id: 1, st: 'sync', name: '個人.pst', path: 'D:\\Mail\\個人.pst', size: '3.2 GB', msgs: '65,135', nw: '+48', last: '今天 13:35', next: '今天 14:35', sub: '62% · 剩餘約 3 分鐘', on: true },
  { id: 2, st: 'queued', name: '封存-2019.pst', path: '\\\\NAS01\\backup\\Outlook\\封存-2019.pst', size: '9.7 GB', msgs: '188,904', nw: '0', last: '昨天 18:05', next: '排入佇列', sub: '佇列第 1 位', on: true },
  { id: 3, st: 'locked', name: 'Outlook.pst', path: 'C:\\Users\\Wen\\AppData\\Local\\Microsoft\\Outlook\\Outlook.pst', size: '6.1 GB', msgs: '97,220', nw: '+312', last: '今天 09:05', next: '今天 14:35 重試', sub: '等待 Outlook 關閉', on: true },
  { id: 4, st: 'failed', name: '專案-客戶A.pst', path: 'E:\\Projects\\客戶A\\專案-客戶A.pst', size: '—', msgs: '23,610', nw: '—', last: '10/22 17:30', next: '今天 14:35', sub: '找不到檔案（E: 未連線）', on: true },
  { id: 5, st: 'ok', name: '2024 工作信箱.pst', path: 'C:\\Users\\Wen\\Documents\\Outlook 檔案\\2024 工作信箱.pst', size: '18.4 GB', msgs: '412,380', nw: '+126', last: '今天 14:05', next: '今天 14:35', sub: '14:05 · +126', on: true },
  { id: 6, st: 'off', name: '舊筆電備份.pst', path: 'D:\\Backup\\Laptop-2021\\舊筆電備份.pst', size: '2.3 GB', msgs: '41,077', nw: '0', last: '9/30 10:12', next: '—（已停用）', sub: '不納入排程', on: false },
];
const HIST = {
  ok:     [['今天 14:05', 'ok', '完成', '+126', '2 分 41 秒', '排程'], ['今天 13:35', 'ok', '未變更，略過', '0', '< 1 秒', '排程'], ['今天 13:05', 'ok', '完成', '+58', '2 分 12 秒', '排程'], ['今天 09:12', 'ok', '完成（啟動補跑）', '+1,204', '6 分 03 秒', '補跑']],
  sync:   [['今天 14:05', 'sync', '同步中 62%', '+2,315', '—', '排程'], ['今天 13:35', 'ok', '完成', '+48', '1 分 10 秒', '排程']],
  queued: [['今天 14:05', 'queued', '等待中', '—', '—', '排程'], ['昨天 18:05', 'ok', '未變更，略過', '0', '< 1 秒', '排程']],
  locked: [['今天 14:05', 'locked', '已鎖定，略過', '—', '—', '排程'], ['今天 13:35', 'locked', '已鎖定，略過', '—', '—', '排程'], ['今天 13:20', 'locked', '已鎖定', '—', '—', '手動'], ['今天 09:05', 'ok', '完成', '+312', '3 分 22 秒', '補跑']],
  failed: [['今天 14:05', 'failed', '找不到檔案', '—', '—', '排程'], ['今天 13:35', 'failed', '找不到檔案', '—', '—', '排程'], ['10/22 17:30', 'ok', '完成', '+19', '40 秒', '排程']],
  off:    [['9/30 10:12', 'ok', '完成', '0', '25 秒', '手動']],
};
const STATE_BAR = {
  sync: `<div class="live"><div class="row1"><strong>同步中 · 匯入郵件</strong><span class="muted caption">41,820 / 67,450 · 1,240 封/秒 · 目前已新增 +2,315</span><span class="spacer"></span><span class="num">62% · 剩餘約 3 分鐘</span></div>
    <div class="progress" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="同步進度"><i style="width:62%"></i></div>
    <div class="phases" aria-hidden="true"><span class="done">檢查變更</span><span class="done">掃描資料夾</span><span class="cur">匯入郵件</span><span>建立搜尋索引</span></div></div>`,
  queued: `<div class="msgbar neutral"><svg class="ic s16"><use href="#i-hour"/></svg><span class="grow">等待中：佇列第 1 位，「個人.pst」完成後開始。檔案於今天 09:12 修改過，這次會讀取新郵件。</span><button type="button" class="btn small">移出佇列</button></div>`,
  locked: `<div class="msgbar warn"><svg class="ic s16"><use href="#i-lock"/></svg><span class="grow"><b>已鎖定 — 等待 Outlook 關閉。</b>Outlook 正在使用這個檔案，14:05 的同步已略過。關閉 Outlook 後，下次排程（14:35）會自動重試；也可以現在按「重試」。連續鎖定 10 次，最後一次成功是今天 09:05。</span><button type="button" class="btn small">重試</button></div>`,
  failed: `<div class="msgbar err"><svg class="ic s16"><use href="#i-err"/></svg><span class="grow"><b>同步失敗：找不到檔案。</b>磁碟 E: 未連線。重新連接後按「重試」，或變更路徑。已保留之前匯入的 23,610 封郵件。</span><button type="button" class="btn small">重試</button><button type="button" class="btn small subtle">變更路徑…</button></div>`,
  off: `<div class="msgbar neutral"><svg class="ic s16"><use href="#i-off"/></svg><span class="grow">已停用：這個路徑不納入排程同步，郵件仍可搜尋。需要時可以按「立即同步」手動同步一次。</span></div>`,
  ok: `<div class="msgbar" style="border-color:var(--okBd);background:var(--okBg)"><svg class="ic s16" style="color:var(--okFg)"><use href="#i-check"/></svg><span class="grow">已是最新。14:05 同步完成，新增 126 封。下次同步：今天 14:35。</span></div>`,
};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => r.querySelectorAll(s);
let view = 1, data = 'full';

function renderList() {
  $('#srcList').innerHTML = SRC.map((s) => `
    <button type="button" class="nav-item" role="option" data-view="${s.id}" aria-selected="${view === s.id}">
      <svg class="ic ${S[s.st].c}"><use href="#${S[s.st].ic}"/></svg><span class="nm">${s.name}</span>
      <span class="sub">${S[s.st].label} · ${s.sub}</span>
      <span class="right">${s.st === 'sync' ? '<div class="progress mini"><i style="width:62%"></i></div>' : ''}<span>${s.msgs}</span></span>
    </button>`).join('');
  $('.nav-item.sched').setAttribute('aria-selected', String(view === 'schedule'));
}
function renderDetail() {
  const d = $('#detail');
  if (view === 'schedule') { d.replaceChildren($('#tpl-schedule').content.cloneNode(true)); wireSchedule(d); return; }
  if (data === 'empty') { d.replaceChildren($('#tpl-empty').content.cloneNode(true)); return; }
  const s = SRC.find((x) => x.id === view), st = S[s.st], busy = s.st === 'sync';
  d.innerHTML = `
    <div class="d-head">
      <span class="pst"><svg class="ic"><use href="#i-pst"/></svg></span>
      <h2>${s.name} <span class="badge ${st.badge}"><svg class="ic s16"><use href="#${st.ic}"/></svg>${st.label}</span></h2>
      <div class="path"><span class="mono" title="${s.path}">${s.path}</span><button type="button" class="btn small subtle icon" aria-label="開啟所在資料夾" title="開啟所在資料夾"><svg class="ic s16"><use href="#i-folder"/></svg></button></div>
      <div class="acts">
        <label class="switch"><input type="checkbox" ${s.on ? 'checked' : ''} aria-label="納入排程同步"><span class="track"></span>納入排程</label>
        <button type="button" class="btn" ${busy ? 'disabled' : ''}><svg class="ic s16"><use href="#i-sync"/></svg>${busy ? '同步中…' : (s.st === 'locked' || s.st === 'failed' ? '重試' : '立即同步')}</button>
        <button type="button" class="btn subtle danger" ${busy ? 'disabled title="同步中無法移除"' : ''}><svg class="ic s16"><use href="#i-trash"/></svg>移除</button>
      </div>
    </div>
    <div class="d-body">
      ${STATE_BAR[s.st]}
      <dl class="tiles">
        <div><dt>大小</dt><dd>${s.size}</dd></div>
        <div><dt>郵件</dt><dd>${s.msgs}</dd></div>
        <div><dt>上次新增</dt><dd class="${s.nw.startsWith('+') ? 'plus' : ''}">${s.nw}</dd></div>
        <div><dt>上次同步</dt><dd>${s.last}</dd></div>
        <div><dt>下次同步</dt><dd>${s.next}</dd></div>
      </dl>
      <div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-tab="hist">同步紀錄</button><button type="button" role="tab" aria-selected="false" data-tab="log">錯誤紀錄</button></div>
      <div data-panel="hist"><table class="grid"><thead><tr><th>時間</th><th>結果</th><th class="n">新增</th><th class="n">耗時</th><th>觸發</th></tr></thead><tbody>
        ${HIST[s.st].map(([t, k, r, n, dur, by]) => `<tr><td class="num">${t}</td><td class="${S[k].c}"><svg class="ic s16"><use href="#${S[k].ic}"/></svg>${r}</td><td class="n">${n}</td><td class="n">${dur}</td><td class="muted">${by}</td></tr>`).join('')}
      </tbody></table></div>
      <div data-panel="log" hidden><ul class="log">${s.st === 'failed'
        ? '<li class="c-err"><svg class="ic s16"><use href="#i-err"/></svg><span class="mono">14:05 open: 系統找不到指定的路徑。(os error 3)</span></li>'
        : s.st === 'locked' ? '<li class="c-lock"><svg class="ic s16"><use href="#i-lock"/></svg><span class="mono">14:05 open: 檔案正由另一個程序使用 (sharing violation) → 延後</span></li>'
        : '<li class="muted">這個 PST 檔案沒有錯誤或警告。</li>'}</ul></div>
    </div>`;
  $$('[data-tab]', d).forEach((b) => b.onclick = () => {
    $$('[data-tab]', d).forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    $$('[data-panel]', d).forEach((p) => { p.hidden = p.dataset.panel !== b.dataset.tab; });
  });
}
function wireSchedule(d) {
  const tl = { off: '<span>—（排程已關閉）</span>', interval: '<span>今天 14:35</span><span>15:05</span><span>15:35</span><span>16:05</span><span>16:35</span>', daily: '<span>週一 08:30</span><span>週二 08:30</span><span>週三 08:30</span><span>週四 08:30</span><span>週五 08:30</span>' };
  $$('input[name=mode]', d).forEach((r) => r.onchange = () => {
    $$('.mode-panel', d).forEach((p) => { p.hidden = p.dataset.mode !== r.value; });
    $('#timeline', d).innerHTML = tl[r.value];
  });
  $$('.days button', d).forEach((b) => b.onclick = () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')));
}
function render() { renderList(); renderDetail(); }
document.addEventListener('click', (e) => {
  const item = e.target.closest('[data-view],[data-goto]');
  if (item && !e.target.closest('.switch')) { const v = item.dataset.view || item.dataset.goto; view = v === 'schedule' ? v : Number(v); render(); }
});
$('#dataSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  $$('#dataSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  data = b.dataset.data;
  $$('[data-when]').forEach((el) => { el.hidden = el.dataset.when !== data; });
  $$('[data-when-disable]').forEach((el) => { el.disabled = el.dataset.whenDisable === data; });
  if (data === 'empty' && view !== 'schedule') view = 0;
  if (data === 'full' && view === 0) view = 1;
  render();
});
render();
</script>
