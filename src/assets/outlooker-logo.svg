<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 74 300 300" role="img" aria-labelledby="title description">
  <title id="title">Outlooker logo</title>
  <desc id="description">An email envelope indexed in a database and searched with a magnifying glass.</desc>
  <defs>
    <linearGradient id="database" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F83F7"/>
      <stop offset="1" stop-color="#113A91"/>
    </linearGradient>
    <linearGradient id="search" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EDDE9"/>
      <stop offset="1" stop-color="#0BA7C2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#0B3B91" flood-opacity=".18"/>
    </filter>
  </defs>

  <g transform="translate(76 59)" filter="url(#shadow)">
    <!-- Indexed PST database -->
    <path d="M28 77C28 51 85 35 156 35s128 16 128 42v137c0 27-57 48-128 48S28 241 28 214z" fill="url(#database)"/>
    <ellipse cx="156" cy="77" rx="128" ry="42" fill="#63AAFF"/>
    <path d="M28 124c0 26 57 47 128 47s128-21 128-47M28 170c0 26 57 47 128 47s128-21 128-47" fill="none" stroke="#B8DCFF" stroke-width="12" opacity=".86"/>

    <!-- Mail -->
    <g transform="translate(70 72)">
      <rect width="172" height="121" rx="18" fill="#FFF"/>
      <path d="m10 16 76 57a1 1 0 0 0 1 0l75-57" fill="none" stroke="#1766D4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m10 108 54-50m98 50-53-50" fill="none" stroke="#9CCBFF" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Fast search -->
    <g transform="translate(202 183)">
      <circle cx="49" cy="49" r="47" fill="url(#search)" stroke="#FFF" stroke-width="11"/>
      <circle cx="42" cy="42" r="18" fill="none" stroke="#FFF" stroke-width="10"/>
      <path d="m57 57 20 20" stroke="#FFF" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>

</svg>
