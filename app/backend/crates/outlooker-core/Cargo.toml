[package]
name = "outlooker-core"
version = "0.1.0"
edition = "2024"

[dependencies]
pff = { path = "../pff" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "=2.0.21"
log = { workspace = true }
ts-rs = "=12.0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "net", "io-util"] }
tokio-postgres = { workspace = true }
deadpool-postgres = "=0.14.2"
refinery = { version = "=0.10.0", features = ["tokio-postgres"] }
ammonia = "=4.2.4"
html2text = "=0.17.4"
encoding_rs = "=0.8.42"
chardetng = "=1.0.0"
image = { workspace = true }
webp = "=0.3.1"
rayon = { workspace = true }
blake3 = "=1.8.7"
getrandom = "=0.4.3"
sysinfo = "=0.39.6"
fs4 = "=1.1.0"
base64 = "=0.23.1"
time = { version = "=0.3.55", features = ["local-offset"] }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
test-support = ["dep:tempfile"]
outlook-fixtures = ["test-support"]
